<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 64" role="img" aria-label="MeetPact">
  <title>MeetPact</title>
  <!-- soft offset shadow -->
  <rect x="6.5" y="19" width="38" height="29" rx="7.5" fill="#FFD95C"/>
  <!-- lens -->
  <path d="M42 26.5 L53.2 19.4 A2.6 2.6 0 0 1 57.2 21.6 V40.4 A2.6 2.6 0 0 1 53.2 42.6 L42 35.5 Z"
        fill="#FFE89A" stroke="#22201B" stroke-width="2" stroke-linejoin="round"/>
  <!-- camera body = the meeting -->
  <rect x="4" y="16.5" width="38" height="29" rx="7.5" fill="#FFFFFF" stroke="#22201B" stroke-width="2"/>
  <!-- notes -->
  <path d="M10.5 24.2 H26.5 M10.5 30.5 H21.5 M10.5 36.8 H20" stroke="#22201B" stroke-width="2" stroke-linecap="round"/>
  <!-- the pact: a checked box -->
  <rect x="25.5" y="28" width="11.5" height="11.5" rx="3" fill="#FFFFFF" stroke="#22201B" stroke-width="1.8"/>
  <path d="M28.6 33.9 L30.6 35.8 L34.2 31.9" fill="none" stroke="#22201B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="72" y="44" font-family="'Space Grotesk', 'Segoe UI', Inter, Arial, sans-serif" font-size="38"
        font-weight="700" letter-spacing="-1.2" fill="#22201B">MeetPact</text>
</svg>
