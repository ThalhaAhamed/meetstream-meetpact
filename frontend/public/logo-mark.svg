<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MeetPact">
  <title>MeetPact</title>
  <!-- hard offset shadow -->
  <rect x="9" y="9" width="51" height="51" rx="12" fill="#2B2540"/>
  <!-- tile -->
  <rect x="4" y="4" width="51" height="51" rx="12" fill="#FFE38F" stroke="#2B2540" stroke-width="3.5"/>
  <!-- speech bubble: the meeting -->
  <path d="M17 15.5h25a5 5 0 0 1 5 5v14a5 5 0 0 1-5 5H27.5l-8.5 7.5v-7.5H17a5 5 0 0 1-5-5v-14a5 5 0 0 1 5-5z"
        fill="#FFFFFF" stroke="#2B2540" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- check: the pact, kept -->
  <path d="M21.5 27.5l5.5 5.5 11-11.5" fill="none" stroke="#2B2540" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
