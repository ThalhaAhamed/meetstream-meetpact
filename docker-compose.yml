services:
  tracker:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/tracker.db
      APP_URL: http://localhost:8000
      FRONTEND_ORIGIN: http://localhost:8000
    volumes:
      - tracker-data:/data
    restart: unless-stopped

volumes:
  tracker-data:
